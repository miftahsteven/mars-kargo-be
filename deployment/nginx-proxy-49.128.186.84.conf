# ==============================================================================
# MARSCARGO BACKEND - NGINX REVERSE PROXY CONFIGURATION
# Location: Proxy Server (IP: 49.128.186.84)
# Domain: mars-api-cargo.mscode.id
# Target File: /etc/nginx/sites-available/mars-api-cargo.conf
# Enable: sudo ln -s /etc/nginx/sites-available/mars-api-cargo.conf /etc/nginx/sites-enabled/
# ==============================================================================

# HTTP Server
server {
    listen 80;
    listen [::]:80;
    server_name mars-api-cargo.mscode.id 49.128.186.84;

    # Certbot ACME Challenge Path
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Reverse Proxy to Apps Server (103.30.247.35:7021)
    location / {
        proxy_pass http://103.30.247.35:7021;
        proxy_http_version 1.1;

        # Header Forwarding
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket & Connection Upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts & Body Size
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 50M;
    }
}

