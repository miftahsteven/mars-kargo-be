# ==============================================================================
# MARSCARGO BACKEND - APACHE2 APPS SERVER CONFIGURATION
# Location: Apps Server (IP: 103.30.247.35)
# Domain: mars-api-cargo.mscode.id
# Target File: /etc/apache2/sites-available/mars-backend-7021.conf
# Enable Modules: sudo a2enmod proxy proxy_http headers rewrite
# Enable Site:    sudo a2ensite mars-backend-7021.conf && sudo systemctl reload apache2
# ==============================================================================

# Ensure "Listen 7021" is added to /etc/apache2/ports.conf
Listen 7021

<VirtualHost *:7021>
    ServerName mars-api-cargo.mscode.id
    ServerAlias 103.30.247.35
    ServerAdmin admin@mscode.id

    # Log Configuration
    ErrorLog ${APACHE_LOG_DIR}/mars_backend_error.log
    CustomLog ${APACHE_LOG_DIR}/mars_backend_access.log combined

    # Enable Proxy Settings
    ProxyPreserveHost On
    ProxyRequests Off

    # Forward Headers from Nginx Proxy Server (49.128.186.84)
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"

    # Reverse Proxy to Local PM2 Node.js Application on Port 7021
    ProxyPass / http://127.0.0.1:7021/
    ProxyPassReverse / http://127.0.0.1:7021/

    # WebSockets & Connection Upgrade Support
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:7021/$1 [P,L]

    # Timeouts & Body Size
    Timeout 60
    KeepAlive On
    MaxKeepAliveRequests 100
</VirtualHost>
